name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    # This name is the required status check on main. It now also runs the test
    # suite; renaming it would stop the required check reporting and block every
    # merge until the branch protection rule is updated to match.
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      ANTHROPIC_API_KEY: ci-anthropic-key
      CHARITY_NAVIGATOR_API_KEY: ci-charity-navigator-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Before the build, which is the slow step: a failing regression test
      # should be reported in seconds rather than after a full compile.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
